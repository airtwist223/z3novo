name: Проблема / Problem
description: Сообщить о проблеме с прошивкой Z3NOVO / Report a problem with the Z3NOVO firmware
title: "[Проблема / Problem] "
body:
  - type: markdown
    attributes:
      value: |
        ### Русский

        Спасибо, что тестируете! Заполните, что знаете: чем подробнее, тем быстрее найдём причину.

        **Что приложить** (подробно — в [инструкции по отчётам](https://github.com/airtwist223/z3novo/blob/main/docs/DIAGNOSTICS.md)):

        1. **Всегда** — отчёт из BIOS: флешка в компьютер, **Del** → **F11**, файл `\Z3NOVO\REPORT-….TXT` с флешки (с версии T1).
        2. **Если Windows или Linux запускаются** — отчёт скрипта: [для Windows (z3report.ps1)](https://github.com/airtwist223/z3novo/blob/main/tools/report/z3report.ps1) или [для Linux (z3report.sh)](https://github.com/airtwist223/z3novo/blob/main/tools/report/z3report.sh), [как запустить](https://github.com/airtwist223/z3novo/blob/main/tools/report/README.md).
        3. **Если сбой редкий и непонятный** — папку с результатами тест-флешки (готовится).

        <details><summary><b>Как запустить скрипт</b> (нажмите, чтобы развернуть)</summary>

        Скачайте файл: откройте ссылку на скрипт и нажмите кнопку «Download raw file» (стрелка вниз справа над текстом). Двойной щелчок по скачанному файлу откроет его в редакторе — это не запуск.

        **Windows:** щёлкните по `z3report.ps1` правой кнопкой → «Выполнить с помощью PowerShell». На вопрос о правах администратора нажмите Enter и подтвердите. Через 1–2 минуты на Рабочем столе появится файл `z3report-os-….txt`.

        **Linux:** откройте папку с файлом (обычно «Загрузки»), щёлкните правой кнопкой по пустому месту → «Открыть в терминале». Если такого пункта нет, откройте терминал и наберите `cd ~/Загрузки` (или `cd ~/Downloads`). Затем наберите `bash z3report.sh` и нажмите Enter. На вопрос про sudo нажмите Enter и введите свой пароль (при вводе он не виден). Файл `z3report-os-….txt` появится в домашней папке, путь скрипт напишет в конце. Строка «dmidecode не установлен» — не ошибка: отчёт всё равно соберётся. Чтобы в него попали планки памяти, поставьте пакет `dmidecode` (например, `sudo apt install dmidecode`) и запустите скрипт ещё раз.

        </details>

        > ⚠️ Если компьютер завис, а потом снова включился — **сначала сделайте отчёт F11**, и только потом сбрасывайте настройки батарейкой: сброс стирает журнал запусков, по которому видна причина.

        ---

        ### English

        Thank you for testing! Fill in what you know: the more detail, the sooner we find the cause.

        **What to attach** (details in [the problem report guide](https://github.com/airtwist223/z3novo/blob/main/docs/DIAGNOSTICS.md)):

        1. **Always** — the BIOS report: USB stick in, **Del** → **F11**, the `\Z3NOVO\REPORT-….TXT` file from the stick (from version T1).
        2. **If Windows or Linux starts** — the script report: [for Windows (z3report.ps1)](https://github.com/airtwist223/z3novo/blob/main/tools/report/z3report.ps1) or [for Linux (z3report.sh)](https://github.com/airtwist223/z3novo/blob/main/tools/report/z3report.sh), [how to run them](https://github.com/airtwist223/z3novo/blob/main/tools/report/README.md).
        3. **If the failure is rare and puzzling** — the test stick's results folder (in preparation).

        <details><summary><b>How to run the script</b> (click to expand)</summary>

        Download the file: open the link to the script and press the "Download raw file" button (the down arrow at the top right of the text). Double-clicking the downloaded file opens it in an editor; that does not run it.

        **Windows:** right-click `z3report.ps1` → "Run with PowerShell". When asked about administrator rights, press Enter and confirm. After a minute or two the file `z3report-os-….txt` appears on the Desktop.

        **Linux:** open the folder with the file (usually Downloads), right-click an empty spot → "Open in Terminal". If there is no such item, open a terminal and type `cd ~/Downloads`. Then type `bash z3report.sh` and press Enter. When asked about sudo, press Enter and type your password (it is not shown as you type). The file `z3report-os-….txt` appears in your home folder; the script prints its path at the end. The line "dmidecode is not installed" is not an error: the report is still made. To get the memory sticks into it, install the `dmidecode` package (for example `sudo apt install dmidecode`) and run the script again.

        </details>

        > ⚠️ If the computer hung and then started again, **make the F11 report first**, and only then reset the settings with the battery: the reset erases the boot log that shows the cause.

        ---
  - type: dropdown
    id: version
    attributes:
      label: Версия Z3NOVO / Z3NOVO version
      description: Видна в заголовке меню (клавиша Del). / Shown in the menu header (the Del key).
      options:
        - T1.1r
        - T1.1
        - T1
        - Другая или пробная сборка — напишите какая в описании / Another or a trial build — say which in the description
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Ревизия платы / Board revision
      description: Напечатана на плате рядом с AM4P2MS. / Printed on the board next to AM4P2MS.
      placeholder: Ver 1.1
  - type: input
    id: cpu
    attributes:
      label: Процессор / Processor
      placeholder: Ryzen 3 2200G
    validations:
      required: true
  - type: input
    id: memory
    attributes:
      label: Память / Memory
      description: Сколько планок, объём, модель или частота; какая частота выставлена в меню. / How many sticks, size, model or speed; the speed set in the menu.
      placeholder: 2 × 8 ГБ Crucial DDR4-2666, «Авто»
  - type: input
    id: video
    attributes:
      label: Видео и монитор / Graphics and monitor
      description: Встроенная графика или видеокарта; в какой разъём включён монитор и каким кабелем. / Built-in graphics or a graphics card; which socket the monitor is on and with what cable.
      placeholder: встроенная графика, DisplayPort → HDMI
  - type: input
    id: os
    attributes:
      label: Система / Operating system
      description: Какая стоит и какой версии; если компьютер до неё не доходит — какая установлена. / Which one and which version; if the computer does not get that far, which one is installed.
      placeholder: Windows 10 Pro 22H2
    validations:
      required: true
  - type: dropdown
    id: when
    attributes:
      label: Когда случилось / When it happened
      options:
        - При включении, до заставки / At power-on, before the logo
        - На заставке или в меню BIOS / On the logo or in the BIOS menu
        - Во время загрузки системы / While the system was starting
        - В работе Windows или Linux / While Windows or Linux was running
        - При перезагрузке, выключении или выходе из сна / At restart, shutdown or wake-up
        - При обновлении BIOS / While updating the BIOS
        - Другое / Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что делали и что случилось / What you did and what happened
      description: Что меняли перед этим (настройки, процессор, память, видеокарту), что ожидали, что увидели. / What you changed before (settings, processor, memory, graphics card), what you expected, what you saw.
    validations:
      required: true
  - type: dropdown
    id: often
    attributes:
      label: Как часто / How often
      options:
        - Один раз / Once
        - Иногда / Sometimes
        - Каждый раз / Every time
  - type: checkboxes
    id: state
    attributes:
      label: Что было с компьютером в этот момент / What the computer was doing at that moment
      options:
        - label: Чёрный экран / Black screen
        - label: Изображение застыло / The picture froze
        - label: Горела лампочка питания / The power light was on
        - label: Вентилятор крутился / The fan was spinning
        - label: Вентилятор на полных оборотах / The fan was at full speed
        - label: Компьютер пищал / The computer beeped
        - label: Помогло долгое нажатие кнопки питания / Holding the power button helped
        - label: Пришлось выдернуть шнур или батарейку / Had to pull the power cord or the battery
  - type: checkboxes
    id: attached
    attributes:
      label: Что приложено / What is attached
      options:
        - label: Отчёт из BIOS (F11) / BIOS report (F11)
        - label: Отчёт скрипта из Windows или Linux / Windows or Linux script report
        - label: Результаты тест-флешки / Test stick results
  - type: textarea
    id: reports
    attributes:
      label: Отчёты / Reports
      description: |
        Перетащите сюда файлы: отчёт из прошивки (F11 в меню, файл REPORT-….TXT с флешки) и, если система запускается, отчёт из Windows или Linux. Перед отправкой откройте файлы и проверьте их.
        Drag the files here: the firmware report (F11 in the menu, the REPORT-….TXT file from the USB stick) and, if the system starts, the Windows or Linux report. Open and check the files before sending.
  - type: textarea
    id: more
    attributes:
      label: Что ещё / Anything else
